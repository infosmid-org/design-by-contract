def getVersionFromFile() {
    def versionFile = new File(project.projectDir, 'version.txt')
    return versionFile.text.trim()
}

group = 'org.infosmid'
version = providers.gradleProperty('releaseVersion').getOrNull() ?: getVersionFromFile()
description = 'Design by Contract for Kotlin Multiplatform'

configurations {
    plantuml
}
configurations.configureEach {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'org.jruby' && details.requested.name == 'jruby-complete') {
            details.useVersion('9.4.8.0')
            details.because('Workaround for setJrubyJarProvider incompatibility in JRuby >= 10.1.0.0')
        }
    }
}

dependencies {

}

asciidoc {
    publications {
        main {
            sourceSet {
                sourceDir = 'src/docs/asciidoc'
                sources {
                    include 'index.adoc'
                }
                resources {
                    include '**/*.png'
                    include '**/*.xml'
                    include '**/*.js'
                    include '**/*.css'
                }
                attributes {
                    addAll 'toc': 'left',
                        'idprefix': '',
                        'idseparator': '-',
                        'docinfo1': '',
                        // Lets index.adoc link to the API docs: link:{api-docs}/index.html[API]
                        'api-docs': 'api'
                }
                missingIncludesAreFatal()
            }
            output 'asciidoctorj', 'html'
        }
    }
}

// The docs zip has its own publication (design-by-contract-doc) so it never goes to Maven Central.
publishing {
    publications {
        documentation(MavenPublication) {
            artifactId = "${project.name}-doc"
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/infosmid-org/${project.name}")
            credentials {
                username = providers.environmentVariable('GITHUB_ACTOR').getOrElse('')
                password = providers.environmentVariable('GITHUB_TOKEN').getOrElse('')
            }
        }
    }
}
tasks.withType(PublishToMavenRepository).configureEach {
    onlyIf {
        if (publication?.name == 'documentation') {
            return !repository?.name?.equalsIgnoreCase('mavenCentral')
        }
        return true
    }
}

// Properties read by gradle/site-docs.gradle (siteDocsZip); must be set before it is applied.
ext {
    siteDocsTitle       = 'Design by Contract'
    siteDocsSummary     = project.description
    siteDocsGuideTask   = 'asciidoctorHtml'
    siteDocsApiTask     = 'dokkaGeneratePublicationHtml'
    siteDocsPublication = 'documentation'
    siteDocsArtifactId  = project.name
    siteDocsTags        = ['Kotlin', 'Multiplatform', 'Contract', 'DBC']
    siteDocsLicense     = 'Apache-2.0'
    siteDocsSourceUrl   = "https://github.com/infosmid-org/${project.name}".toString()
}
apply from: "$project.projectDir/gradle/site-docs.gradle"

tasks.register('updateReadmeVersion') {
    group = 'documentation'
    description = 'Modifies :project-version: attribute at the top of README.adoc'
    def readmeFile = layout.projectDirectory.file('README.adoc').asFile
    def projectVersion = providers.provider { project.version.toString() }
    inputs.property('version', projectVersion)
    outputs.file(readmeFile)
    doLast {
        if (!readmeFile.exists()) return
        def content = readmeFile.text
        def versionStr = projectVersion.get()
        def versionAttr = ":project-version: ${versionStr}"
        if (content =~ /(?m)^:project-version:.*$/) {
            content = content.replaceFirst(/(?m)^:project-version:.*$/, versionAttr)
        } else {
            def matcher = content =~ /(?m)^(=[^\r\n]*\r?\n)/
            if (matcher.find()) {
                content = content.substring(0, matcher.end()) + versionAttr + "\n" + content.substring(matcher.end())
            } else {
                content = versionAttr + "\n" + content
            }
        }
        readmeFile.text = content
    }
}

tasks.register('copyPng', Copy) {
    from(projectDir) {
        include '*.png'
    }
    into "${layout.buildDirectory.asFile.get()}/docs/asciidoc"
}

asciidoctorHtml.dependsOn('updateReadmeVersion')
asciidoctorHtml.dependsOn('copyPng')

